[package]
name = "nimbus"
version = "0.1.0"
description = "Nimbus - a simple, local-only SSH connection manager"
edition = "2021"

[lib]
name = "nimbus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
getrandom = "0.4.3"
keyring = "4.2.0"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
