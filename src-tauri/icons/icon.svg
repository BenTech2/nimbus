<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Nimbus app icon. To regenerate the PNG/ICNS/ICO set: render this to a 1024px PNG with a
       transparent background (e.g. headless Chrome), save it as source.png, then run
       `npx tauri icon src-tauri/icons/source.png -o src-tauri/icons` and delete android/ and ios/. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="0.55" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="380" y1="520" x2="640" y2="680">
      <stop offset="0" stop-color="#3f7cff"/>
      <stop offset="1" stop-color="#6b47f5"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1440" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1060" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile: the 824px rounded square macOS expects inside a 1024 canvas. -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- Cloud -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="232" y="486" width="560" height="236" rx="118"/>
    <circle cx="384" cy="508" r="122"/>
    <circle cx="560" cy="440" r="172"/>
    <circle cx="674" cy="590" r="118"/>
  </g>

  <!-- Terminal prompt  >_  -->
  <g fill="none" stroke="url(#ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="398,534 474,594 398,654"/>
    <line x1="520" y1="654" x2="632" y2="654"/>
  </g>
</svg>
